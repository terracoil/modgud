# Lint gate (as CLAUDE.md states it, without --fix) and the test suite on every supported Python.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate-and-test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # one red version should not hide the others
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        id: python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pipx install poetry==2.4.1  # the version that wrote poetry.lock

      - name: Install dependencies
        run: |
          poetry env use "${{ steps.python.outputs.python-path }}"
          poetry install --with dev

      - name: Ruff lint
        run: poetry run ruff check modgud/ tests/ examples/

      - name: Ruff format
        run: poetry run ruff format --check modgud/ tests/ examples/

      - name: Mypy (library and free-range examples)
        run: poetry run mypy modgud/ examples/free_range/

      - name: Mypy (classy examples)
        run: poetry run mypy examples/classy/

      - name: Pytest
        run: poetry run pytest
