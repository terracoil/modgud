[project]
name = "modgud"
authors = [{ name = "Steven Miers", email = "steven.miers@gmail.com" }]
description = "Expression-oriented programming for Python 3.11+ with guard clause decorators and implicit returns. Eliminate defensive coding clutter through declarative input validation and Ruby/Rust-style automatic return transformation, all while maintaining single return point architecture, with a single tiny dependency, Idunn, for port/adapter wiring."
keywords = ["guards", "validation", "decorators", "defensive-programming", "single-return-point", "implicit-return"]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11.0,<4.0.0"
version = "2.0.0"
dependencies = ["idunn (>=2.0.0,<3.0.0)"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/terracoil/modgud/blob/main/README.md"
Repository = "https://github.com/terracoil/modgud"
Documentation = "https://github.com/terracoil/modgud/blob/main/docs/README.md"
Freyja = "https://pypi.org/project/freyja"
Idunn = "https://pypi.org/project/idunn"

[tool.poetry]
include = ["LICENSE", "README.md", "modgud/py.typed"]
packages = [{ include = "modgud" }]

# Temporary: develop against the sibling checkout. Drop this table (and re-lock) before release.
[tool.poetry.dependencies]
idunn = ">=2.0.0, <3.0.0"
#idunn = { path = "../idunn", develop = true }

[dependency-groups]
test = [
    "pytest (>=8.4.2,<9.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "pytest-timeout (>=2.3.1,<3.0.0)",
    "ruff (>=0.14.2,<0.15.0)",
]
dev = [
    { include-group = "test" },
    "mypy[reports] (>=1.18.2,<2.0.0)",
    "pre-commit (>=4.3.0,<5.0.0)",
    "poetry-dynamic-versioning (>=1.9.1,<2.0.0)",
    "twine (>=6.0)",
    "freyja (>=2.0.2,<3.0.0)"
]

[tool.pytest.ini_options]
cache_dir = "tmp/.pytest_cache"
minversion = "8.0"
addopts = "-ra -q --strict-markers --cov=modgud --cov-report=term-missing"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.11"
cache_dir = "tmp/.mypy_cache"
exclude = ["build/", "dist/", "tests/test_fixtures.py"]
strict = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_return_any = true
warn_no_return = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = false
follow_imports = "normal"
follow_imports_for_stubs = true
namespace_packages = true
explicit_package_bases = true
enable_error_code = [
    "name-defined", "name-match", "syntax", "arg-type", "assignment", "return-value",
    "union-attr", "operator", "index", "type-abstract", "valid-type", "var-annotated",
    "override", "return", "misc", "import",
]
incremental = true
cache_fine_grained = true
show_error_context = true
show_column_numbers = true
show_error_codes = true
pretty = true
color_output = true
error_summary = true
show_absolute_path = false

# Test files - slightly less strict for practicality
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = true

# Examples: implicit-return bodies end in a bare expression, which mypy reads as a missing return.
[[tool.mypy.overrides]]
module = "examples.*"
disable_error_code = ["return"]

[tool.poetry-dynamic-versioning]
enable = false
vcs = "git"
style = "semver"

[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning>=1.0.0,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"
