[project]
name = "modgud"
authors = [{ name = "Steven Miers", email = "steven.miers@gmail.com" }]
description = "Expression-oriented programming for Python 3.11+ with guard clause decorators and implicit returns. Eliminate defensive coding clutter through declarative input validation and Ruby/Rust-style automatic return transformation, all while maintaining single return point architecture and zero runtime dependencies."
keywords = ["guards", "validation", "decorators", "defensive-programming", "single-return-point", "implicit-return"]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11.0,<4.0.0"
version = "1.3.0" # Uses poetry-dynamic-versioning
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/terracoil/modgud/blob/master/README.md"
Repository = "https://github.com/terracoil/modgud"
Documentation = "https://github.com/terracoil/modgud/blob/main/docs/README.md"

[tool.poetry]
include = ["LICENSE", "README.md", "modgud/py.typed"]
packages = [{ include = "modgud" }]

[dependency-groups]
test = [
    "pytest (>=8.4.2,<9.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "pytest-timeout (>=2.3.1,<3.0.0)",
    "ruff (>=0.14.2,<0.15.0)",
]
dev = [
    { include-group = "test" },
    "mypy[reports] (>=1.18.2,<2.0.0)",
    "pre-commit (>=4.3.0,<5.0.0)",
    "freyja (>=2.0.1,<3.0.0)",
    "poetry-dynamic-versioning (>=1.9.1,<2.0.0)"
]

[tool.pytest.ini_options]
cache_dir = "tmp/.pytest_cache"
minversion = "8.0"
addopts = "-ra -q --strict-markers --cov=modgud --cov-report=term-missing"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.11"

[tool.poetry-dynamic-versioning]
enable = false
vcs = "git"
style = "semver"

[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning>=1.0.0,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"
